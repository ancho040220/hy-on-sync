[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hy-on-sync"
version = "0.1.0"
description = "HY-ON(LMS) 과제를 노션 과제 플래너에 동기화하고 카카오톡으로 알림"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "icalendar>=6.0",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
hysync = "hysync.sync:main"
hysync-mcp = "hysync.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
