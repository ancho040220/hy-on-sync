name: sync

on:
  schedule:
    # KST 07:37부터 23:37까지 2시간마다 (= UTC 22:37, 00:37, 02:37 ... 14:37), 하루 9번.
    # GitHub는 정각(:00)에 몰리는 예약을 늦추거나 버리므로 37분에 둔다. 몇 번 빠져도 하루 여러 번 돌고,
    # 같은 알림은 기록(노션 '알림 기록', state/alert_log.json)으로 한 번만 보낸다.
    - cron: "37 0,2,4,6,8,10,12,14,22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "쓰지 않고 계획만 출력"
        type: boolean
        default: false

permissions:
  contents: write # state/alert_log.json 커밋용

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .

      - name: Write Google service account key
        env:
          GCAL_SA: ${{ secrets.GCAL_SERVICE_ACCOUNT_JSON }}
        # Secret이 비어 있으면 파일을 만들지 않는다 → 미러를 건너뛴다
        run: if [ -n "$GCAL_SA" ]; then printf '%s' "$GCAL_SA" > gcal-service-account.json; fi

      - name: Sync
        env:
          HYON_BASE_URL: ${{ secrets.HYON_BASE_URL }}
          HYON_TOKEN: ${{ secrets.HYON_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
          GCAL_TARGET_CALENDAR_ID: ${{ secrets.GCAL_TARGET_CALENDAR_ID }}
          COURSE_ALIASES: ${{ vars.COURSE_ALIASES }}
        run: python -m hysync.sync ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Rotate Kakao refresh token
        if: always() && hashFiles('.kakao_refresh_token') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }} # 이 저장소 Secrets 쓰기 권한이 있는 fine-grained PAT
        run: |
          gh secret set KAKAO_REFRESH_TOKEN < .kakao_refresh_token
          rm -f .kakao_refresh_token

      - name: Commit alert log
        if: always()
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: update alert log"
            git pull --rebase --autostash   # 실행 중 main에 다른 커밋이 들어와도 기록 push가 막히지 않게
            git push
          fi

      - name: Remove Google service account key
        if: always()
        run: rm -f gcal-service-account.json
