name: sync

on:
  schedule:
    # 정시 실행은 외부 크론(cron-job.org)이 2시간마다 정각(KST 1·3·…·23시) workflow_dispatch로 부른다.
    # GitHub 예약은 몇 시간씩 늦거나 빠져서, 외부 크론이 멈췄을 때를 위한 보조로만 하루 2번 둔다
    # (KST 13:47, 21:47 = UTC 04:47, 12:47). 같은 알림은 기록으로 한 번만 보내므로 겹쳐 돌아도 된다.
    - cron: "47 4,12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "쓰지 않고 계획만 출력"
        type: boolean
        default: false

permissions:
  contents: write # state/alert_log.json 커밋용

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .

      - name: Write Google service account key
        env:
          GCAL_SA: ${{ secrets.GCAL_SERVICE_ACCOUNT_JSON }}
        # Secret이 비어 있으면 파일을 만들지 않는다 → 미러를 건너뛴다
        run: if [ -n "$GCAL_SA" ]; then printf '%s' "$GCAL_SA" > gcal-service-account.json; fi

      - name: Sync
        env:
          HYON_BASE_URL: ${{ secrets.HYON_BASE_URL }}
          HYON_TOKEN: ${{ secrets.HYON_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          # 알림은 디스코드 봇 DM. 카카오(나에게 보내기)는 알림이 울리지 않아 넘기지 않는다(끔).
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
          GCAL_TARGET_CALENDAR_ID: ${{ secrets.GCAL_TARGET_CALENDAR_ID }}
          COURSE_ALIASES: ${{ vars.COURSE_ALIASES }}
        run: python -m hysync.sync ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit alert log
        if: always()
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: update alert log"
            git pull --rebase --autostash   # 실행 중 main에 다른 커밋이 들어와도 기록 push가 막히지 않게
            git push
          fi

      - name: Remove Google service account key
        if: always()
        run: rm -f gcal-service-account.json
